{% extends "base.html" %}

{% block lab %}Лабораторная работа 2{% endblock %}

{% block main %}
    <h1>Список книг</h1>
    <table border="1" cellpadding="6">
        <tr>
            <th>№</th><th>Автор</th><th>Название</th><th>Жанр</th><th>Страниц</th>
        </tr>
        {% for b in books %}
        <tr>
            <td>{{ loop.index }}</td>
            <td>{{ b.author }}</td>
            <td>{{ b.title }}</td>
            <td>{{ b.genre }}</td>
            <td>{{ b.pages }}</td>
        </tr>
        {% endfor %}
    </table>
{% endblock %}
